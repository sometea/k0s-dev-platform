apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: strapi-route
  namespace: strapi
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /strapi
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: strapi-service
          port: 80
