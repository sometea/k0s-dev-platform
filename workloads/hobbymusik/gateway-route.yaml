apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hobbymusik-route
  namespace: hobbymusik
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway-fabric
  hostnames:
    - "*"
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: /hobbymusik(/|$)(.*)
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: hobbymusik-service
          port: 80
